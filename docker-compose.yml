services:
  api:
    build: ./backend
    ports:
      - "8008:8008"
    volumes:
      - sworkr_data:/data
      - ./backend:/app        # live code: backend restarts itself when you save a file
    environment:
      - DATA_DIR=/data
      - WATCHFILES_FORCE_POLLING=true   # needed for file-change detection on Windows
    command: uvicorn main:app --host 0.0.0.0 --port 8008 --reload
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the container's Linux node_modules, not the Windows one
    environment:
      - API_PROXY_TARGET=http://api:8008
    depends_on:
      - api
    restart: unless-stopped

  # Runs the backend tests, then exits:  docker compose run --rm tests
  # It uses its own throwaway database and never touches the sworkr_data volume.
  tests:
    build: ./backend
    profiles: ["test"]      # keeps it out of a plain "docker compose up"
    volumes:
      - ./backend:/app:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: >
      sh -c "pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements-dev.txt
      && python -m pytest -p no:cacheprovider"

volumes:
  sworkr_data:
