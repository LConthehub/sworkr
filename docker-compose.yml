# Sworkr: your own back office, on your own computer.
#
#   docker compose up -d              start
#   docker compose pull && docker compose up -d      update to the newest version
#   docker compose down               stop          (never add -v: it deletes your records)
#
# Then open http://localhost:8008 and make your account.
# Want different folders, a content drive or email? sworkr.com/docs/install.html writes this file for you.

name: sworkr          # keep this name: it's how Docker finds your records again

services:
  sworkr:
    image: ghcr.io/lconthehub/sworkr:latest      # ready-made: nothing to build
    # build: .        # or build it yourself from the source instead (use this line, not the one above)
    ports:
      - "127.0.0.1:8008:8008"     # this computer only. For your phone, see sworkr.com/docs/phone.html
    volumes:
      - sworkr_data:/data           # your records (encrypted)
      - sworkr_keys:/keys           # the key that locks them: kept apart from the records and backups
      - ./backups:/backups          # encrypted daily backups, in a folder next to this file
      # A content library from a folder or drive (read only; sworkr never changes it). Uncomment and change
      # the left side, then choose "Mounted folder" in Settings > Content library:
      # - D:/Content:/content:ro
    environment:
      # Email for safety check-in alerts and sign-in codes. Put the values in a file called .env next to this
      # one (see .env.example), never in this file.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - PASSKEY_ORIGINS=${PASSKEY_ORIGINS:-}
    restart: unless-stopped

volumes:
  sworkr_data:
  sworkr_keys:
