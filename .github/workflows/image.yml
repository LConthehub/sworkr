# Builds the ready-made Sworkr image and publishes it on GitHub's container registry (free for public images):
#   ghcr.io/<owner>/sworkr:latest     the newest version on main
#   ghcr.io/<owner>/sworkr:1.2.3      a release (push a tag like v1.2.3)
# For Intel/AMD computers and ARM ones (Apple silicon Macs, Raspberry Pi). Users then need no building:
#   in docker-compose.yml, replace "build: ." with "image: ghcr.io/<owner>/sworkr:latest".

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sworkr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
