# Development setup (for working on sworkr itself): both containers reload when you save a file.
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml run --rm tests        the backend tests
# To just use sworkr, use docker-compose.yml instead.
#
# Ports are bound to 127.0.0.1, so sworkr can only be opened from this computer,
# not from other devices on your network.

services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - sworkr_data:/data
      # The key that seals saved passwords, kept apart from the database (see backend/vault.py).
      - sworkr_keys:/keys
      - ./backups:/backups    # automatic encrypted backups land here, in the project folder
      # Content library from a folder on this computer, a NAS share or a drive (read-only; sworkr never changes it).
      # Uncomment and change the left side, then choose "Mounted folder" under Settings → Content library:
      # - D:/Content:/content:ro
      - ./backend:/app        # live code: backend restarts itself when you save a file
    environment:
      - DATA_DIR=/data
      - KEY_DIR=/keys
      - BACKUP_DIR=/backups
      - WATCHFILES_FORCE_POLLING=true   # needed for file-change detection on Windows
      # Email account used to send safety check-in alerts. Set these in a file called .env (see .env.example).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - PASSKEY_ORIGINS=${PASSKEY_ORIGINS:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8008 --reload
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the container's Linux node_modules, not the Windows one
    environment:
      - API_PROXY_TARGET=http://api:8008
    depends_on:
      - api
    restart: unless-stopped

  # Runs the backend tests, then exits:  docker compose -f docker-compose.dev.yml run --rm tests
  # It uses its own throwaway database and never touches the sworkr_data volume.
  tests:
    build: ./backend
    profiles: ["test"]      # keeps it out of a plain "docker compose up"
    volumes:
      - ./backend:/app:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: >
      sh -c "pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements-dev.txt
      && python -m pytest -p no:cacheprovider"

volumes:
  sworkr_data:
  sworkr_keys:
