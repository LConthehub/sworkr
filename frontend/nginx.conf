server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV imports and backups can be a few megabytes.
    client_max_body_size 10m;

    server_tokens off;   # don't announce the nginx version

    # Don't let the page be embedded in other sites, don't leak addresses to them, and only run sworkr's own
    # scripts (a Content-Security-Policy stops injected scripts even if one ever got onto a page).
    # Note: nginx drops these server-level headers in any location that sets its own add_header, so the
    # locations below repeat them.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://api:8008;
        proxy_set_header Host $host;
        # Keep the visitor's address that a front proxy (Caddy) put here, and add ours after it. The API's
        # login limiter counts failures per visitor; without this every visitor would share one address,
        # and bots guessing passwords could lock everyone out.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Built files have a fingerprint in their name, so they can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Every other address is a page inside the app.
    location / {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
